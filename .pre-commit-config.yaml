repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: debug-statements
  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ['--profile=black']
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          - '--max-line-length=121'
          - '--max-complexity=10'            # C901: number of branches
          - '--max-cognitive-complexity=10'  # CCR001: branches + nesting depth
        additional_dependencies:
          - flake8-cognitive-complexity==0.1.0